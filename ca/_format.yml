format:
  html:
    include-in-header:
      - text: |
          <script>
          /**
           * Handles language switching functionality for a multi-language website
           * @param {string} targetLang - The target language code ('es', 'ca', or 'en')
           */
          function switchLanguage(targetLang) {
              // Get the current URL path
              const currentPath = window.location.pathname;
              console.log('Current path:', currentPath);
              console.log('Target language:', targetLang);
              
              // Auto-detect if running on GitHub Pages or localhost
              // This handles different base paths for different environments
              const isGitHubPages = window.location.hostname.includes('github.io');
              const basePath = isGitHubPages ? '/wikiPedro_MasterUPF/' : '/';
              console.log('Environment:', isGitHubPages ? 'GitHub Pages' : 'localhost');
              console.log('Base path:', basePath);
              
              // Clean the path by removing the base path and any leading slashes
              let cleanPath = currentPath.replace(basePath, '').replace(/^\//, '');
              console.log('Clean path after removing base:', cleanPath);
              
              // Remove any existing language prefix from the path
              // This ensures we don't stack language codes when switching multiple times
              if (cleanPath.startsWith('es/')) {
                  cleanPath = cleanPath.substring(3);
              } else if (cleanPath.startsWith('en/')) {
                  cleanPath = cleanPath.substring(3);
              }
              console.log('Clean path after removing language prefix:', cleanPath);
              
              // Handle the root index page case
              if (cleanPath === '' || cleanPath === 'index.html') {
                  cleanPath = 'index.html';
              }
              
              // Construct the new URL path based on the target language
              let newPath;
              if (targetLang === 'ca') {
                  // Catalan is the default language, so no prefix needed
                  newPath = basePath + cleanPath;
              } else if (targetLang === 'es') {
                  // Add Spanish prefix
                  newPath = basePath + 'es/' + cleanPath;
              } else if (targetLang === 'en') {
                  // Add English prefix
                  newPath = basePath + 'en/' + cleanPath;
              }
              
              console.log('New path:', newPath);
              // Navigate to the new URL
              window.location.href = newPath;
          }

          /**
           * Event listener that runs when the DOM is fully loaded
           * This adds target="_blank" to external links for better user experience
           */
          document.addEventListener('DOMContentLoaded', function() {
              // Find the external link to pedrogeogisdev.com
              const externalLink = document.querySelector('a[href="https://pedrogeogisdev.com/"]');
              if (externalLink) {
                  // Make the link open in a new tab
                  externalLink.setAttribute('target', '_blank');
                  // Add security attributes for external links
                  externalLink.setAttribute('rel', 'noopener noreferrer');
              }
          });
          </script>
      - text: |
          <script data-goatcounter="https://pedromartinezduran.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
      - text: |
          <script>
            (function () {
                let r = new XMLHttpRequest();
                r.addEventListener('load', function () {
                  try {
                    let data = JSON.parse(this.responseText);
                    document.querySelector('#gc-visitors').innerText = data.count;
                  } catch (e) {
                    console.error(e);
                  }
                });
                r.open('GET', 'https://pedromartinezduran.goatcounter.com/counter/' +
                              encodeURIComponent('/') + '.json?t=' + Date.now());
                r.send();
              })();
          </script>
      - text: |
          <script>
            (function() {
              function updateViews() {
                if (!window.goatcounter || !window.goatcounter.get_data) {
                  console.error('GoatCounter not ready');
                  return;
                }
                const el = document.querySelector('#page-views-value');
                if (!el) {
                  console.error('Target element #page-views-value not found in DOM');
                  return;
                }
                const path = window.goatcounter.get_data()['p']; // matches GoatCounter UI[web:1]
                const r = new XMLHttpRequest();
                r.addEventListener('load', function() {
                  try {
                    const data = JSON.parse(this.responseText);
                    el.innerText = data.count; // formatted string with separators[web:1]
                  } catch (e) {
                    console.error('Failed to parse GoatCounter response', e);
                  }
                });
                r.open('GET', 'https://pedromartinezduran.goatcounter.com/counter/' +
                  encodeURIComponent(path) + '.json');
                r.send();
              }
              // Wait a bit to ensure GoatCounter has set get_data()
              let attempts = 0;
              const t = setInterval(function() {
                attempts++;
                if (window.goatcounter && window.goatcounter.get_data) {
                  clearInterval(t);
                  updateViews();
                } else if (attempts > 50) {
                  clearInterval(t);
                  console.error('GoatCounter get_data not available after 5 seconds');
                }
              }, 100);
            })();
          </script>
    filters:
      - fontawesome
    lightbox:
      match: auto
      effect: fade
      desc-position: bottom
      loop: false
    theme:
      light: [minty, style-assets/light-styles.scss]
      dark: [slate, style-assets/dark-styles.scss]
    linestretch: 1.5
    toc: true
    toc-title: "En aquesta pàgina trobaràs"
    toc-indent: 3em
    toc-depth: 3
    number-sections: true
    smooth-scroll: true
    code-link: true
    code-line-numbers: true
    code-overflow: "wrap"
    code-annotations: below
    grid:
      sidebar-width: 500px
      body-width: 1400px
      margin-width: 400px
      gutter-width: 2rem
    page-layout: full
    cap-location: bottom
