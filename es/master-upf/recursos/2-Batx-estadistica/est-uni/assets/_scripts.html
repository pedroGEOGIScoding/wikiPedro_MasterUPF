<!-- =====================================================================
     _scripts.html — TEMA 1 ESTADÍSTICA UNIDIMENSIONAL · 2.º Batx
     Ubicación: 2-Batx-estadistica/est-uni/assets/_scripts.html

     Se inserta en cada .qmd:
       format:
         html:
           include-after-body: assets/_scripts.html
           html-math-method: katex

     ORDEN DE CARGA OBLIGATORIO
       1) ../assets/applets.css          estilos compartidos de la asignatura
       2) assets/est1-applets.css        estilos propios de Estadística 1D
       3) ../assets/katex/katex.min.css  KaTeX local, sin CDN
       4) ../assets/katex/katex.min.js   motor local de fórmulas
       5) assets/est1-applets.js         núcleo window.EST1
       6) assets/est1-applets-extra.js   applets complementarios

     RUTAS
       Los .qmd se renderizan dentro de est-uni/. Por eso ../assets/
       apunta a 2-Batx-estadistica/assets/, donde ya están applets.css
       y katex/. Los módulos propios viven en est-uni/assets/.

     KaTeX se usa manualmente sobre nodos data-tex, con throwOnError:false.
     No se emplea OJS, auto-render, CDN ni librerías de terceros.
     ===================================================================== -->
