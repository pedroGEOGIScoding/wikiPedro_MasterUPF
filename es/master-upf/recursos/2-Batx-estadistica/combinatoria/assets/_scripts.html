     _scripts.html — TEMA 3 COMBINATORIA · 2.º Batx
     Ubicación: 2-Batx-estadistica/combinatoria/assets/_scripts.html

     Se inserta en cada .qmd del tema:
       format:
         html:
           include-after-body: assets/_scripts.html
           html-math-method: katex

     ORDEN DE CARGA OBLIGATORIO
       1) ../assets/applets.css          estilos compartidos de la asignatura
       2) assets/est3-applets.css        estilos propios de Combinatoria
       3) ../assets/katex/katex.min.css  KaTeX local, sin CDN
       4) ../assets/katex/katex.min.js   motor local de fórmulas
       5) assets/est3-applets.js         núcleo window.EST3
       6) assets/est3-applets-a.js       applets 1-16  (conteo, factorial, variaciones)
       7) assets/est3-applets-b.js       applets 17-36 (permutaciones, combinaciones,
                                         Pascal, Newton, resumen y práctica)

     RUTAS
       Los .qmd se renderizan dentro de combinatoria/. Por eso ../assets/
       apunta a 2-Batx-estadistica/assets/, donde ya están applets.css
       y katex/. Los módulos propios viven en combinatoria/assets/.

     KaTeX se usa manualmente sobre nodos data-tex, con throwOnError:false.
     No se emplea OJS, auto-render, CDN ni librerías de terceros.
     ===================================================================== -->
