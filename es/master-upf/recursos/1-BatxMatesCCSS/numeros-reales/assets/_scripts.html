<!-- =====================================================================
     _scripts.html — TEMA 1 NÚMEROS REALES · 1.º Batx Mates CCSS
     Ubicación: 1-BatxMatesCCSS/numeros-reales/assets/_scripts.html

     Se inyecta al final de <body> en cada .qmd del tema:
       format:
         html:
           include-after-body: assets/_scripts.html
           html-math-method: katex

     ORDEN DE CARGA OBLIGATORIO
       1) ../assets/applets.css        estilos compartidos de la asignatura
       2) assets/re-applets.css       estilos propios de Números reales
       3) ../assets/katex/katex.min.css   KaTeX local, sin CDN
       4) ../assets/katex/katex.min.js    motor local de fórmulas
       5) assets/re-applets.js        núcleo window.RE
       6) assets/re-applets-a.js      racionales, irracionales, reales, intervalos
       7) assets/re-applets-b.js      notación científica, aproximaciones, errores
       8) assets/re-applets-c.js      radicales y logaritmos

     RUTAS
       Los .qmd se renderizan dentro de numeros-reales/. Por eso
       ../assets/ apunta a 1-BatxMatesCCSS/assets/, donde ya están
       applets.css y katex/. Los módulos propios viven en
       numeros-reales/assets/.

     KaTeX se aplica a mano sobre los nodos data-tex que genera el motor,
     con throwOnError:false. No se usa OJS, auto-render, CDN ni librerías
     de terceros: todo funciona también sin conexión.

     INSERCIÓN DE APPLETS EN LOS .qmd
       ::: {#panel-clave .applet-panel data-applet-re="clave"}
       :::

     RECORDATORIO PARA es/_quarto.yml
       resources:
         - master-upf/recursos/1-BatxMatesCCSS/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/numeros-reales/assets/**
     ===================================================================== -->

<link rel="stylesheet" href="../assets/applets.css">
<link rel="stylesheet" href="assets/re-applets.css">

<!-- KaTeX local: una sola copia para todo el sitio, sin dependencia de red. -->
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script defer src="../assets/katex/katex.min.js"></script>

<!-- Núcleo y módulos, en este orden. -->
<script defer src="assets/re-applets.js"></script>
<script defer src="assets/re-applets-a.js"></script>
<script defer src="assets/re-applets-b.js"></script>
<script defer src="assets/re-applets-c.js"></script>

<script>
  window.addEventListener('load', function () {
    if (!window.katex) console.warn('[reales] KaTeX no cargado: revisa ../assets/katex/.');
    if (!window.RE) { console.warn('[reales] re-applets.js no se ha cargado.'); return; }
    if (window.RE.extraA !== true) console.warn('[reales] falta re-applets-a.js');
    if (window.RE.extraB !== true) console.warn('[reales] falta re-applets-b.js');
    if (window.RE.extraC !== true) console.warn('[reales] falta re-applets-c.js');
  });
</script>
