<!-- =====================================================================
     _scripts.html — TEMA 3 POLINOMIOS Y FRACCIONES ALGEBRAICAS
     1.º Bachillerato · Matemáticas Aplicadas a las CCSS
     Ubicación: 1-BatxMatesCCSS/polinomios/assets/_scripts.html

     Se inyecta al final de <body> en cada .qmd del tema:
       format:
         html:
           include-after-body: assets/_scripts.html
           html-math-method: katex

     ORDEN DE CARGA OBLIGATORIO
       1) ../assets/applets.css     estilos compartidos de la asignatura
       2) assets/pol-applets.css    estilos propios de Polinomios
       3) ../assets/katex/katex.min.css   KaTeX local, sin CDN
       4) ../assets/katex/katex.min.js    motor local de fórmulas
       5) assets/pol-applets.js     núcleo window.POL
       6) assets/pol-applets-a.js   anatomía, operaciones, división
       7) assets/pol-applets-b.js   Ruffini, teorema del resto, raíces
       8) assets/pol-applets-c.js   factorización y fracciones algebraicas

     RUTAS
       Los .qmd se renderizan dentro de polinomios/. Por eso ../assets/
       apunta a 1-BatxMatesCCSS/assets/, donde ya están applets.css y
       katex/. Los módulos propios viven en polinomios/assets/.

     KaTeX se aplica a mano sobre los nodos data-tex que genera el motor,
     con throwOnError:false. No se usa OJS, auto-render, CDN ni librerías
     de terceros: todo funciona también sin conexión.

     INSERCIÓN DE APPLETS EN LOS .qmd
       ::: {#panel-clave .applet-panel data-applet-pol="clave"}
       :::

     RECORDATORIO PARA es/_quarto.yml
       resources:
         - master-upf/recursos/1-BatxMatesCCSS/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/polinomios/assets/**
     ===================================================================== -->

<link rel="stylesheet" href="../assets/applets.css">
<link rel="stylesheet" href="assets/pol-applets.css">

<!-- KaTeX local: una sola copia para todo el sitio, sin dependencia de red. -->
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script defer src="../assets/katex/katex.min.js"></script>

<!-- Núcleo y módulos, en este orden. -->
<script defer src="assets/pol-applets.js"></script>
<script defer src="assets/pol-applets-a.js"></script>
<script defer src="assets/pol-applets-b.js"></script>
<script defer src="assets/pol-applets-c.js"></script>

<script>
  window.addEventListener('load', function () {
    if (!window.katex) console.warn('[polinomios] KaTeX no cargado: revisa ../assets/katex/.');
    if (!window.POL) { console.warn('[polinomios] pol-applets.js no se ha cargado.'); return; }
    if (window.POL.extraA !== true) console.warn('[polinomios] falta pol-applets-a.js');
    if (window.POL.extraB !== true) console.warn('[polinomios] falta pol-applets-b.js');
    if (window.POL.extraC !== true) console.warn('[polinomios] falta pol-applets-c.js');
  });
</script>
