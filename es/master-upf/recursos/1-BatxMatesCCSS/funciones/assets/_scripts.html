<!-- =====================================================================
     _scripts.html — FUNCIONES · 1r Batx Mates CCSS

     Se inyecta al final de <body> en las paginas nuevas del tema,
     mediante format: html: include-after-body en cada .qmd.

     ORDEN OBLIGATORIO
       1) applets.css   REUTILIZADA del tema de ecuaciones e inecuaciones
       2) katex.min.css REUTILIZADO del mismo sitio, servido en local
       3) katex.min.js
       4) auto-render   define window.renderMathInElement
       5) fn-applets.js applets del tema -> window.FNAPP

     ATENCION
     Este tema NO usa OJS ni window.POLY. Trae su propio compilador de
     expresiones, porque necesita evaluar raices, logaritmos, valores
     absolutos y cocientes, no solo polinomios.

     ATRIBUTOS DE INSERCION, uno por modulo, para que no se pisen:
       polinomios                 data-applet="clave"
       ecuaciones e inecuaciones  data-applet-eq="clave"
       sistemas                   data-applet-sys="clave"
       funciones                  data-applet-fn="clave"

     RECORDATORIO PARA es/_quarto.yml
       resources:
         - files/**
         - master-upf/recursos/1-BatxMatesCCSS/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/polinomios/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/ecuaciones-inecuaciones/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/sistemas-ecuaciones-inecuaciones/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/funciones/assets/**
     ===================================================================== -->

<link rel="stylesheet" href="../assets/applets.css">

<!-- KaTeX servido en local desde la carpeta del tema de ecuaciones:
     una sola copia para todo el sitio, sin dependencia de red. -->
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script defer src="../assets/katex/katex.min.js"></script>
<script defer src="../assets/katex/contrib/auto-render.min.js"></script>

<!-- Applets de funciones. -->
<script defer src="assets/fn-applets.js"></script>

<script>
  window.addEventListener('load', function () {
    if (!window.katex) {
      console.warn('[funciones] KaTeX no cargado: revisa la ruta a ../assets/katex/.');
    }
    if (!window.renderMathInElement) {
      console.warn('[funciones] auto-render no disponible.');
    }
    if (!window.FNAPP) {
      console.warn('[funciones] fn-applets.js no se ha cargado: revisa assets/fn-applets.js.');
    }
  });
</script>
