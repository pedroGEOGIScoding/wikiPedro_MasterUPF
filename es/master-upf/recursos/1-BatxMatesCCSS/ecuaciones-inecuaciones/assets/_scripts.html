<!-- =====================================================================
     _scripts.html — TEMA 3 ECUACIONES E INECUACIONES
     1.º Bachillerato · Matemáticas Aplicadas a las CCSS
     Ubicación: 1-BatxMatesCCSS/ecuaciones-inecuaciones/assets/_scripts.html

     Se inyecta al final de <body> en cada .qmd del tema:
       format:
         html:
           include-after-body: assets/_scripts.html
           html-math-method: katex

     ORDEN DE CARGA OBLIGATORIO
       1) ../assets/applets.css     estilos compartidos de la asignatura
       2) assets/eq-applets.css     estilos propios de Ecuaciones
       3) ../assets/katex/katex.min.css   KaTeX local, sin CDN
       4) ../assets/katex/katex.min.js    motor local de fórmulas
       5) assets/eq-applets.js      núcleo window.EQ
       6) assets/eq-applets-a.js    primer grado, segundo grado, bicuadradas
       7) assets/eq-applets-b.js    racionales, radicales, factorización,
                                    logarítmicas y exponenciales
       8) assets/eq-applets-c.js    trigonométricas e inecuaciones

     RUTAS
       Los .qmd se renderizan dentro de ecuaciones-inecuaciones/. Por eso
       ../assets/ apunta a 1-BatxMatesCCSS/assets/, donde ya están
       applets.css y katex/. Los módulos propios viven en assets/.

     El núcleo es autónomo: incorpora su propio motor algebraico exacto
     (fracciones con BigInt, polinomios, Ruffini, factorización) y no
     depende de la carpeta de otros temas.

     KaTeX se aplica a mano sobre los nodos data-tex que genera el motor,
     con throwOnError:false. No se usa OJS, auto-render, CDN ni librerías
     de terceros: todo funciona también sin conexión.

     INSERCIÓN DE APPLETS EN LOS .qmd
       ::: {#panel-clave .applet-panel data-applet-eq="clave"}
       :::

     RECORDATORIO PARA es/_quarto.yml
       resources:
         - master-upf/recursos/1-BatxMatesCCSS/assets/**
         - master-upf/recursos/1-BatxMatesCCSS/ecuaciones-inecuaciones/assets/**
     ===================================================================== -->

<link rel="stylesheet" href="../assets/applets.css">
<link rel="stylesheet" href="assets/eq-applets.css">

<!-- KaTeX local: una sola copia para todo el sitio, sin dependencia de red. -->
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script defer src="../assets/katex/katex.min.js"></script>

<!-- Núcleo y módulos, en este orden. -->
<script defer src="assets/eq-applets.js"></script>
<script defer src="assets/eq-applets-a.js"></script>
<script defer src="assets/eq-applets-b.js"></script>
<script defer src="assets/eq-applets-c.js"></script>

<script>
  window.addEventListener('load', function () {
    if (!window.katex) console.warn('[ecuaciones] KaTeX no cargado: revisa ../assets/katex/.');
    if (!window.EQ) { console.warn('[ecuaciones] eq-applets.js no se ha cargado.'); return; }
    if (window.EQ.extraA !== true) console.warn('[ecuaciones] falta eq-applets-a.js');
    if (window.EQ.extraB !== true) console.warn('[ecuaciones] falta eq-applets-b.js');
    if (window.EQ.extraC !== true) console.warn('[ecuaciones] falta eq-applets-c.js');
  });
</script>
