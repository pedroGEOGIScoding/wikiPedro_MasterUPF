<!-- =====================================================================
     _scripts.html — TEMA 3 SISTEMAS DE ECUACIONES · 2.º Batx Mates CCSS
     Ubicación: 2-BatxMatesCCSS/sistemas/assets/_scripts.html
     Se inserta en cada parte con:
         format:
           html:
             include-after-body: assets/_scripts.html
             html-math-method: katex

     ORDEN OBLIGATORIO
       1) applets.css            hoja común del curso, en ../assets
       2) sis-applets.css        extras propios del tema (clases .mx-*)
       3) katex.min.css          KaTeX servido en LOCAL, sin CDN
       4) katex.min.js           motor de fórmulas, en local
       5) sis-applets.js         núcleo + applets de las partes 1, 2, 3
       6) sis-applets-extra.js   applets de las partes 4 a 9

     NOTA SOBRE LAS RUTAS
       Las páginas se renderizan en sistemas/, así que ../assets apunta
       a 2-BatxMatesCCSS/assets y assets/ a sistemas/assets.

     NOTA SOBRE KaTeX
       NO se usa auto-render. Cada applet marca sus fórmulas con
       data-tex y el núcleo llama a katex.render con throwOnError:false.
       Así una fórmula mal escrita nunca rompe el resto de la página.

     RECORDATORIO PARA EL DESPLIEGUE
       Si Quarto no copia esta carpeta al sitio, añade en _website.yml:
         project:
           resources:
             - "master-upf/recursos/2-BatxMatesCCSS/assets/**"
             - "master-upf/recursos/2-BatxMatesCCSS/sistemas/assets/**"

     COMPROBACIÓN
       ls -la de esta carpeta debe mostrar CUATRO archivos. El guion bajo
       inicial de este archivo hace que se pierda con los comodines del
       shell, así que usa siempre la opción -a.
     ===================================================================== -->

<link rel="stylesheet" href="../assets/applets.css">
<link rel="stylesheet" href="assets/sis-applets.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script defer src="../assets/katex/katex.min.js"></script>
<script defer src="assets/sis-applets.js"></script>
<script defer src="assets/sis-applets-extra.js"></script>
