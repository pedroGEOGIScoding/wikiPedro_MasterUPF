format:
  html:
    include-after-body:
      - js/language-switcher.js
    filters:
      - fontawesome
    lightbox:
      match: auto
      effect: fade
      desc-position: bottom
      loop: true
    theme: lux
    css: styles.css
    line-numbers: true
    linestretch: 1.5
    toc: true
    toc-title: "On this page you will find"
    toc-indent: 3em
    toc-depth: 3
    number-sections: true
    smooth-scroll: true
    background-color: black
    code-link: true
    code-line-numbers: "true"
    code-overflow: "wrap"
    code-annotations: below
    grid:
      sidebar-width: 400px   
      body-width: 1400px      
      margin-width: 400px   
      gutter-width: 0.5rem   
    page-layout: full

